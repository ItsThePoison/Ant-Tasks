<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="./src/output.css">

    <style>
        ul#taskList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 0.75rem = 12px;
        }
        ul#taskList li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: oklch(37.3% 0.034 259.733);
            padding: 12px;
            margin: 4px;
            border-radius: 6px;
            animation: slideIn 0.2s ease;
            font-weight: bold;
            text-transform: capitalize;
        }
        ul#taskList li span {
            flex: 1;
            word-break: break-word;
        }
        ul#taskList li.done span {
            text-decoration: line-through;
            color: oklch(87.2% 0.01 258.338); 
        }
        ul#taskList li input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin: 4px 8px 4px 4px;
            accent-color: oklch(52.7% 0.154 150.069);
            flex-shrink: 0;
        }
        .actions { display: flex; gap: 6px; margin-left: 8px; }
        .actions button {
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
        }

        .delete-btn img {
            padding: 4px;
            margin: 4px;
            border-radius: 6px ;
            color: oklch(87.2% 0.01 258.338);
            transition-duration: 400ms;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .delete-btn img:hover {
            background-color: var(--color-red-700) /* oklch(50.5% 0.213 27.518) */
        }
    </style>
</head>
<body class="bg-gray-950 select-none">

    <div class="bg-gray-800 m-3 rounded-md justify-between items-center flex" style="-webkit-app-region: drag;">
        <h1 class="text-gray-300 font-bold p-4 text-2xl flex items-center gap-2">
            <img src="src/tasks_icon.svg" alt="">
            Daily To-Do List
        </h1>
        <button onclick="closeWindow()" class="bg-gray-700 text-gray-300 rounded-md p-3 m-2 hover:bg-red-700 transition duration-400 hover:ease-in-out hover:shadow-2x1 hover:shadow-black" style="-webkit-app-region: no-drag;">
            <img class="w-6 h-6" src="src/close.svg" alt="Close">
        </button>
    </div>

    <div class="bg-gray-800 text-gray-300 m-3 mt-10 rounded-md p-4">

        <div class="input-row">
            <input 
            class="bg-gray-700 text-gray-300 font-bold border-none rounded-md p-3 m-1 placeholder:text-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-950 focus:border-gray-950 focus:shadow-black focus:shadow-2xl transition duration-400 hover:ease-in-out" 
            type="text" 
            id="taskInput" 
            placeholder="What Is The Task?">

            <button class="bg-gray-700 text-gray-300 font-bold cursor-pointer rounded-md p-3 m-2 hover:bg-green-700 transition duration-400 hover:ease-in-out" id="addTask">
                + Add Task
            </button>
            <button class="bg-gray-700 text-gray-300 font-bold cursor-pointer rounded-md p-3 m-2 hover:bg-red-700 transition duration-400 hover:ease-in-out" id="removeTask">
                - Clear All
            </button>
        </div>

        <ul id="taskList"></ul>

        <p class="text-gray-300 font-bold bg-gray-700 p-1 m-1 rounded-md" id="taskCounter"></p>

    </div>

<script>
const input = document.getElementById('taskInput');
const btnAdd = document.getElementById('addTask');
const list = document.getElementById('taskList');
const counter = document.getElementById('taskCounter');
const removeAll = document.getElementById('removeTask');

let taskCount = 0;

function updateCounter () {
    counter.textContent = taskCount === 0
     ? `No tasks`
     : `${taskCount} Tasks Created`; 
}

function addTask() {
    const text = input.value.trim();
    if (text === '') {
        input.focus();
        return;
    }

    taskCount++;
    
    const li = document.createElement('li');
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.title = 'Mark Completed' / 'Not Completed';
    checkbox.onchange = () => li.classList.toggle('done', checkbox.checked);
    
    const span = document.createElement('span');
    span.textContent = text;
    
    const actionDiv = document.createElement('div');
    actionDiv.className = 'action';
    
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.innerHTML = '<img src="src/delete.svg" alt="Delete">';
    delBtn.title = 'Delete task';
    delBtn.onclick = () => {
        li.remove();
        taskCount--;
        updateCounter();
    }

    actionDiv.appendChild(delBtn);
    
    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(actionDiv);
    list.appendChild(li);

    input.value = '';
    input.focus();
    updateCounter();
}

btnAdd.addEventListener('click', addTask);
 
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
});
 
updateCounter();

const { ipcRenderer } = require('electron');

function closeWindow() {
    ipcRenderer.send('close-window');
};

removeAll.addEventListener('click', () => {
    list.innerHTML = '';
    taskCount = 0;
    updateCounter();
})
</script>

</body>
</html>
