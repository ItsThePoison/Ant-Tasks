<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body class="bg-gray-950">

    <div class="bg-gray-800 m-3 rounded-md justify-between items-center flex">
        <h1 class="text-gray-300 font-bold p-4 text-2xl">Daily To-Do List</h1>
        <button onclick="closeWindow()" class="bg-gray-700 text-gray-300 rounded-md p-3 m-2 hover:bg-red-700 transition duration-400 hover:ease-in-out hover:shadow-2x1 hover:shadow-black" style="-webkit-app-region: no-drag;">
            <img class="w-6 h-6" src="src/close.svg" alt="Close">
        </button>
    </div>

    <div class="bg-gray-800 text-gray-300 m-3 mt-10 rounded-md p-4">

        <div class="input-row">
            <button id="addTask">+ Add Task</button>
            <input type="text" id="taskInput" placeholder="What is the task?">
        </div>

        <ul id="taskList"></ul>
        <p class="taskCounter" id="taskCounter"></p>

    </div>

<script>
const input = document.getElementById('taskInput');
const btnAdd = document.getElementById('addTask');
const list = document.getElementById('taskList');
const counter = document.getElementById('taskCounter');

let taskCount = 0;

function updateCounter () {
    counter.textContent = taskCount === 0
     ? `No tasks`
     : `${taskCount} Tasks Created`; 
}

function addTask() {
    const text = input.value.trim();
    if (text === '') {
        input.focus();
        return;
    }

    taskCount++;
    
    const li = document.createElement('li');
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.title = 'Mark Completed' / 'Not Completed';
    checkbox.onchange = () => li.classList.toggle('done', checkbox.checked);
    
    const span = document.createElement('span');
    span.textContent = text;
    
    const actionDiv = document.createElement('div');
    actionDiv.className = 'action';
    
    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️';
    delBtn.title = 'Delete task';
    delBtn.onclick = () => {
        li.remove();
        taskCount--;
        updateCounter();
    }

    actionDiv.appendChild(delBtn);
    
    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(actionDiv);
    list.appendChild(li);

    input.value = '';
    input.focus();
    updateCounter();
}

btnAdd.addEventListener('click', addTask);
 
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
});
 
updateCounter();

const { ipcRenderer } = require('electron');

function closeWindow() {
    ipcRenderer.send('close-window');
}

</script>

</body>
</html>
