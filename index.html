<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
    <link rel="stylesheet" href="src/output.css">
</head>
<body>

    <div class="bg-amber-600">
        <h1 class="underline">daily to-do list</h1>
    </div>

    <div class="container">

        <div class="input-row">
            <button id="addTask">+ Add Task</button>
            <input type="text" id="taskInput" placeholder="What is the task?">
        </div>

        <ul id="taskList"></ul>
        <p class="taskCounter" id="taskCounter"></p>

    </div>

<script>
const input = document.getElementById('taskInput');
const btnAdd = document.getElementById('addTask');
const list = document.getElementById('taskList');
const counter = document.getElementById('taskCounter');

let taskCount = 0;

function updateCounter () {
    counter.textContent = taskCount === 0
     ? `No tasks`
     : `${taskCount} Tasks Created`; 
}

function addTask() {
    const text = input.value.trim();
    if (text === '') {
        input.focus();
        return;
    }

    taskCount++;
    
    const li = document.createElement('li');
    
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.title = 'Mark Completed' / 'Not Completed';
    checkbox.onchange = () => li.classList.toggle('done', checkbox.checked);
    
    const span = document.createElement('span');
    span.textContent = text;
    
    const actionDiv = document.createElement('div');
    actionDiv.className = 'action';
    
    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️';
    delBtn.title = 'Delete task';
    delBtn.onclick = () => {
        li.remove();
        taskCount--;
        updateCounter();
    }

    actionDiv.appendChild(delBtn);
    
    li.appendChild(checkbox);
    li.appendChild(span);
    li.appendChild(actionDiv);
    list.appendChild(li);

    input.value = '';
    input.focus();
    updateCounter();
}

btnAdd.addEventListener('click', addTask);
 
input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
});
 
updateCounter();
</script>

</body>
</html>
