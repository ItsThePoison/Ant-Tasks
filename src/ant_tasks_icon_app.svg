<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fundo -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF" stroke="#000000" stroke-width="8"/>

  <!-- Prancheta de tarefas -->
  <g stroke="#000000" stroke-width="10" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <rect x="128" y="150" width="256" height="300" rx="16" fill="#FFFFFF"/>
    <!-- Clip da prancheta -->
    <rect x="206" y="128" width="100" height="40" rx="10" fill="#FFFFFF"/>

    <!-- Linhas de tarefas com checkboxes -->
    <rect x="158" y="220" width="26" height="26" rx="4"/>
    <path d="M164 233 l6 7 l14 -16" stroke-width="7"/>
    <line x1="200" y1="233" x2="352" y2="233"/>

    <rect x="158" y="280" width="26" height="26" rx="4"/>
    <path d="M164 293 l6 7 l14 -16" stroke-width="7"/>
    <line x1="200" y1="293" x2="352" y2="293"/>

    <rect x="158" y="340" width="26" height="26" rx="4"/>
    <line x1="200" y1="353" x2="330" y2="353"/>
  </g>

  <!-- Formiga em cima da prancheta, carregando/apontando para a lista -->
  <g fill="#000000">
    <!-- Pernas esquerdas -->
    <g stroke="#000000" stroke-width="7" stroke-linecap="round">
      <line x1="330" y1="330" x2="290" y2="310"/>
      <line x1="330" y1="345" x2="285" y2="345"/>
      <line x1="330" y1="360" x2="290" y2="380"/>
      <!-- Pernas direitas -->
      <line x1="378" y1="330" x2="418" y2="310"/>
      <line x1="378" y1="345" x2="423" y2="345"/>
      <line x1="378" y1="360" x2="418" y2="380"/>
      <!-- Antenas -->
      <line x1="335" y1="270" x2="315" y2="235"/>
      <line x1="372" y1="270" x2="392" y2="235"/>
    </g>
    <circle cx="313" cy="228" r="7"/>
    <circle cx="394" cy="228" r="7"/>

    <!-- Cabeça -->
    <circle cx="354" cy="290" r="30"/>
    <!-- Torax -->
    <ellipse cx="354" cy="335" rx="26" ry="24"/>
    <!-- Abdomen -->
    <ellipse cx="354" cy="385" rx="36" ry="34"/>
  </g>
</svg>
